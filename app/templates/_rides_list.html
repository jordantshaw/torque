<div id="rides-panel">
  <p class="current-hours">Current hours: {{ current_hours }}</p>

  <section class="log-ride">
    <h2>Log a ride</h2>
    {% include "_ride_form.html" %}
  </section>

  <section class="rides-history">
    <h2>Ride history</h2>
    <ul class="rides-list">
      {% for ride in rides %}
      <li id="ride-{{ ride.id }}" class="ride-item">
        <div class="ride-info">
          <span class="ride-date">{{ ride.date }}</span>
          <span class="ride-hours">{{ ride.hours }}h</span>
          {% if ride.notes %}<span class="ride-notes">{{ ride.notes }}</span>{% endif %}
        </div>
        <div class="ride-actions">
          <button type="button" class="ride-edit-btn" hx-get="/bikes/{{ bike.id }}/rides/{{ ride.id }}/edit" hx-target="#ride-{{ ride.id }}" hx-swap="outerHTML">Edit</button>
          <form class="ride-delete-form" hx-post="/bikes/{{ bike.id }}/rides/{{ ride.id }}/delete" hx-target="#rides-panel" hx-swap="outerHTML">
            <button type="submit">Delete</button>
          </form>
        </div>
      </li>
      {% else %}
      <li class="rides-empty">No rides logged yet.</li>
      {% endfor %}
    </ul>
  </section>
</div>
