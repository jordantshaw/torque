{% if wrapper_id %}<div id="{{ wrapper_id }}" class="ride-item ride-editing">{% endif %}
{% if error %}
<p class="form-error">{{ error }}</p>
{% endif %}
<form class="ride-form" hx-post="{{ action }}" hx-target="#rides-panel" hx-swap="outerHTML">
  <label>Date<input type="date" name="date" value="{{ values.date if values.date is not none else '' }}"></label>
  <label>Hours<input type="number" name="hours" min="0.1" step="0.1" value="{{ values.hours if values.hours is not none else '' }}"></label>
  <label>Notes<input type="text" name="notes" value="{{ values.notes if values.notes is not none else '' }}" placeholder="Optional"></label>

  <fieldset class="suspension-fields">
    <legend>Suspension settings (optional)</legend>
    <label>Fork compression (clicks out)<input type="number" name="fork_compression" step="1" value="{{ values.fork_compression if values.fork_compression is not none else '' }}"></label>
    <label>Fork rebound (clicks out)<input type="number" name="fork_rebound" step="1" value="{{ values.fork_rebound if values.fork_rebound is not none else '' }}"></label>
    <label>Shock low-speed compression (clicks out)<input type="number" name="shock_lsc" step="1" value="{{ values.shock_lsc if values.shock_lsc is not none else '' }}"></label>
    <label>Shock high-speed compression (turns out)<input type="number" name="shock_hsc" step="any" value="{{ values.shock_hsc if values.shock_hsc is not none else '' }}"></label>
    <label>Shock rebound (clicks out)<input type="number" name="shock_rebound" step="1" value="{{ values.shock_rebound if values.shock_rebound is not none else '' }}"></label>
    <label>Static sag (mm)<input type="number" name="sag_static" step="1" value="{{ values.sag_static if values.sag_static is not none else '' }}"></label>
    <label>Rider sag (mm)<input type="number" name="sag_rider" step="1" value="{{ values.sag_rider if values.sag_rider is not none else '' }}"></label>
  </fieldset>

  <button type="submit">{{ submit_label }}</button>
  {% if cancel_url %}
  <a href="{{ cancel_url }}" class="cancel-link">Cancel</a>
  {% endif %}
</form>
{% if wrapper_id %}</div>{% endif %}
