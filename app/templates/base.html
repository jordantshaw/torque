<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Torque{% endblock %}</title>
  <meta name="color-scheme" content="dark">
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/htmx.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
  {% from "_icons.html" import icon %}
  {% set on_garage = request.url.path == "/" %}
  <div class="app">
    <header class="topbar">
      <div class="topbar-inner">
        <a href="/" class="brand"><span class="brand-mark">{{ icon("wrench", 18) }}</span>Torque</a>
        <nav class="topnav" aria-label="Main">
          <a href="/" class="topnav-link{% if on_garage %} active{% endif %}">{{ icon("home", 16) }}<span>Garage</span></a>
        </nav>
      </div>
    </header>
    <main class="page">
      {% block content %}{% endblock %}
    </main>
  </div>
  {% block scripts %}{% endblock %}
</body>
</html>
